{% extends 'base.html' %}

{% block title %}Error {{ code }} - College Events{% endblock %}

{% block content %}
<div class="row justify-content-center text-center py-5">
    <div class="col-md-6">
        <div class="card custom-card p-5 shadow-sm">
            <div class="display-1 text-danger fw-bold mb-3">{{ code }}</div>
            <h3 class="fw-bold mb-3">{{ "Forbidden" if code == 403 else "Page Not Found" if code == 404 else "Internal Server Error" }}</h3>
            <p class="text-muted mb-4">{{ message }}</p>
            <div>
                <a href="{{ url_for('main.index') }}" class="btn btn-primary px-4 me-2">
                    <i class="fas fa-home me-1"></i> Return Home
                </a>
                <a href="javascript:history.back()" class="btn btn-outline-secondary px-4">
                    <i class="fas fa-arrow-left me-1"></i> Go Back
                </a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
