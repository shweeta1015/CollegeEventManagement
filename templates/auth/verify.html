{% extends 'base.html' %}

{% block title %}Verify Email - College Events Portal{% endblock %}

{% block content %}
<div class="row justify-content-center py-4">
    <div class="col-md-6 col-lg-5">
        <div class="card custom-card p-4 p-md-5 shadow-sm text-center">
            <div class="rounded-circle bg-success bg-opacity-10 d-inline-flex p-3 text-success mb-3">
                <i class="fas fa-envelope-open-text fa-2x"></i>
            </div>
            <h3 class="fw-bold mb-2">Email Verification</h3>
            <p class="text-muted small mb-4">
                Enter your verification token to complete account activation. For local demonstration, this token is displayed upon registration.
            </p>

            <form method="POST" action="{{ url_for('auth.verify_email') }}">
                <div class="mb-3 text-start">
                    <label class="form-label fw-bold small">Verification Token</label>
                    <input type="text" name="token" class="form-control text-center fw-bold" placeholder="VERIF-XXXXXXXXXXXXXXXX" value="{{ token if token else '' }}" required>
                </div>
                <button type="submit" class="btn btn-success w-100 py-2 fw-bold shadow-sm">
                    <i class="fas fa-check-circle me-1"></i> Verify & Activate Account
                </button>
            </form>

            <div class="mt-4 small">
                <a href="{{ url_for('auth.login') }}">Return to Login</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
